name: prairie_tizen
description: Prairie Smart TV client for Samsung Tizen (flutter-tizen).
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  prairie_core:
    path: ../prairie_core

  flutter_riverpod: ^2.6.1
  shared_preferences_tizen: ^2.3.5
  flutter_secure_storage_tizen: ^0.1.6
  path_provider_tizen: ^2.3.3
  # Path fork of 0.6.0: returns the native seek failure reason to Dart and
  # tees plugin logs to stderr (retail TVs block dlog). See its CHANGELOG.
  video_player_videohole:
    path: ../video_player_videohole
  device_info_plus_tizen: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Required: prairie_core uses Material Icons extensively (shell nav, player).
  # Keep true until Icons.* are replaced with custom SVG/font assets — otherwise
  # every Icon widget renders as a box and MaterialIcons.otf is still needed.
  uses-material-design: true
