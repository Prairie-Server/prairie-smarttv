name: Unit Tests

# Flutter-first CI for the Smart TV rewrite. The TypeScript app under src/ is
# being retired — do not reintroduce npm lint/build as the primary gate.
#
# What this workflow can do on stock ubuntu-latest:
#   - flutter analyze + flutter test for prairie_core (fully supported)
#   - flutter analyze for prairie_tizen Dart sources (pub.dev plugins resolve;
#     native Tizen linking is NOT exercised here)
#   - flutter analyze for the webOS pub workspace (prairie_webos +
#     flutter_secure_storage_webos) when git plugin deps resolve (Dart only;
#     flutter-webos / NDK are NOT installed on runners)
#
# What it cannot do without custom runners / cached SDKs:
#   - flutter-tizen build tpk
#   - flutter-webos build / ares-package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarttv-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-core:
    name: prairie_core analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/packages/prairie_core
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  flutter-tizen-analyze:
    name: prairie_tizen analyze (Dart only)
    runs-on: ubuntu-latest
    needs: flutter-core
    defaults:
      run:
        working-directory: flutter/packages/prairie_tizen
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # video_player_avplay / *_tizen plugins resolve from pub.dev; analyze
      # covers Dart. Native Tizen compile requires flutter-tizen (not here).
      - name: Analyze
        run: flutter analyze --fatal-infos

  flutter-webos-analyze:
    name: prairie_webos analyze (Dart only)
    runs-on: ubuntu-latest
    needs: flutter-core
    defaults:
      run:
        # Workspace root for prairie_webos + flutter_secure_storage_webos.
        working-directory: flutter/packages
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lg-flutter-webos plugins are git deps; needs network egress to GitHub.
      # Resolves the pub workspace (prairie_webos + flutter_secure_storage_webos).
      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos prairie_webos flutter_secure_storage_webos

  prairie-invariants:
    name: Prairie invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check Prairie invariants
        run: scripts/check-prairie-invariants.sh

  package-layout:
    name: Validate 4-variant package layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Validate manifests + stamp scripts
        run: bash flutter/scripts/validate-package-layout.sh
  webos-native-build:
    name: webOS native build
    runs-on: ubuntu-22.04
    needs: flutter-webos-analyze
    env:
      WEBOS_NDK_INSTALLER_URL: "https://github.com/lg-flutter-webos/ndk/releases/download/11.2.0/webos-ndk-flutter-starfish-x86_64-ca9v1-11.2.0.sh"
      WEBOS_FLUTTER_NDK_ENV: "/usr/local/starfish-sdk-x86_64/environment-setup-ca9v1-webosmllib32-linux-gnueabi"
      WEBOS_ARES_NODE_VERSION: "24.8.0"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install webOS host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip cmake pkg-config file libgtk-3-0 libgtk-3-dev git ninja-build clang git-lfs

      - name: Set up Node for ares-cli
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.WEBOS_ARES_NODE_VERSION }}

      - name: Install ares-cli
        run: npm install -g @webos-tools/cli

      - name: Install webOS NDK
        run: |
          set -euo pipefail
          curl -fsSL -o ndk-installer.sh "${WEBOS_NDK_INSTALLER_URL}"
          chmod +x ndk-installer.sh
          sudo ./ndk-installer.sh -y
          rm ndk-installer.sh
          test -f "${WEBOS_FLUTTER_NDK_ENV}"

      - name: Point flutter-webos at the NDK
        run: echo "WEBOS_FLUTTER_NDK_ENV=${WEBOS_FLUTTER_NDK_ENV}" >> "${GITHUB_ENV}"

      - name: Cache flutter-webos
        id: cache-flutter-webos
        uses: actions/cache@v4
        with:
          path: ~/flutter-webos
          key: flutter-webos-checkout-v1

      - name: Install flutter-webos
        if: steps.cache-flutter-webos.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/lg-flutter-webos/flutter-webos.git "${HOME}/flutter-webos"

      - name: Add flutter-webos to PATH
        run: echo "${HOME}/flutter-webos/bin" >> "${GITHUB_PATH}"

      - name: Doctor + precache
        run: |
          set -euo pipefail
          source "${WEBOS_FLUTTER_NDK_ENV}"
          flutter-webos doctor -v
          flutter-webos precache

      - name: Native release build
        run: |
          set -euo pipefail
          source "${WEBOS_FLUTTER_NDK_ENV}"
          bash flutter/scripts/build-webos.sh

      - name: Verify IPK
        run: |
          set -euo pipefail
          test -s flutter/artifacts/Prairie-webos.ipk
          file flutter/artifacts/Prairie-webos.ipk
