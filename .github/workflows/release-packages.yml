name: Release packages

# Builds unsigned store staging packages for Samsung Tizen (.wgt) and LG webOS
# (.ipk). Store signing still requires Samsung / LG developer certificates
# locally — see platforms/tizen/README.md and platforms/webos/README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to stamp (e.g. 1.2.3). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: smarttv-release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Tizen + webOS packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Stamp manifests
        run: node scripts/stamp-version.mjs "${{ steps.version.outputs.version }}"

      - name: Typecheck and unit tests
        run: |
          npm run build
          npm run test:coverage

      - name: Install webOS ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package Tizen (.wgt) and webOS (.ipk)
        run: npm run package:store

      - name: List artifacts
        run: |
          set -euo pipefail
          ls -la artifacts
          test -n "$(find artifacts -name '*.wgt' -print -quit)"
          test -n "$(find artifacts -name '*.ipk' -print -quit)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prairie-smarttv-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.wgt
            artifacts/*.ipk
            artifacts/*.zip
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.wgt
            artifacts/*.ipk
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Prairie Smart TV ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
