name: Release packages

# Builds store staging packages for Samsung Tizen (.wgt) and LG webOS (.ipk).
# Tizen signing runs only when TIZEN_* certificate secrets are configured —
# see platforms/tizen/README.md. webOS .ipk via ares-package; store re-sign
# remains a local LG Partner step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to stamp (e.g. 1.2.3). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: smarttv-release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Tizen + webOS packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Stamp manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/stamp-version.mjs "$VERSION"

      - name: Typecheck and unit tests
        run: |
          npm run build
          npm run test:coverage

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Package Tizen (.wgt) and webOS (.ipk)
        run: npm run package:store

      - name: Sign Tizen package (optional)
        env:
          TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
          TIZEN_SECURITY_PROFILE: ${{ secrets.TIZEN_SECURITY_PROFILE }}
        run: bash scripts/ci-sign-tizen.sh

      - name: List artifacts
        run: |
          set -euo pipefail
          ls -la artifacts
          test -n "$(find artifacts -name 'Prairie-*-tizen-unsigned.wgt' -print -quit)"
          test -n "$(find artifacts -name 'Prairie-*-tizen-legacy-unsigned.wgt' -print -quit)"
          test -n "$(find artifacts -name '*.ipk' -print -quit)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prairie-smarttv-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.wgt
            artifacts/*.ipk
            artifacts/*.zip
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.wgt
            artifacts/*.ipk
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Prairie Smart TV ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
