name: Release packages

# Builds / stages the four Flutter Smart TV artifacts:
#   1. webOS .ipk
#   2. Tizen TPK api-version 6.0  (Tizen OS 6.0 only)
#   3. Tizen TPK api-version 6.5  (Tizen OS 6.5–9.0)
#   4. Tizen TPK api-version 10.0 (Tizen OS 10.0 only)
#
# ---------------------------------------------------------------------------
# CI REALITY (ubuntu-latest, 2026-07):
#   flutter-tizen and flutter-webos are NOT installable as simple apt/npm
#   packages. They need:
#     - flutter-tizen clone + Tizen Studio + TV Extensions + certificates
#     - flutter-webos (Linux-only) + webOS NDK + Node 14–16 ares CLI
#   Stock GitHub-hosted runners cannot produce real .tpk / .ipk binaries.
#
# This workflow therefore:
#   (a) ALWAYS runs Flutter analyze/test + package-layout validation
#   (b) Exposes a matrix of packaging jobs that CALL the build scripts when
#       the toolchains are present (self-hosted / future SDK cache), and
#       otherwise skip with an explicit notice — never a red X from missing
#       SDKs on ubuntu-latest
#   (c) Keeps artifact upload / GitHub Release steps ready for when builds
#       actually produce files under flutter/artifacts/
#
# Local / self-hosted full builds:
#   bash flutter/scripts/build-tizen.sh 6.0
#   bash flutter/scripts/build-tizen.sh 6.5 --package-version 1.0.1
#   bash flutter/scripts/build-tizen.sh 10.0 --package-version 1.0.2 --obfuscate
#   bash flutter/scripts/build-webos.sh --obfuscate
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver label for artifact names (e.g. 1.2.3). Empty = git describe / 0.0.0."
        required: false
        type: string
      attempt_native_builds:
        description: "If true, run build-*.sh (will skip when SDKs missing unless fail_without_sdk)."
        required: false
        type: boolean
        default: true
      fail_without_sdk:
        description: "If true, fail packaging jobs when flutter-tizen/flutter-webos are missing."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smarttv-release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-verify:
    name: Flutter analyze + test + layout
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0)"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: prairie_core analyze + test
        working-directory: flutter/packages/prairie_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Validate 4-variant package layout
        run: bash flutter/scripts/validate-package-layout.sh

  # Matrix ready for real SDK builds. On ubuntu-latest the scripts exit 127
  # when toolchains are missing; we convert that into a soft skip unless
  # fail_without_sdk is set (self-hosted runners with SDKs should set it).
  package:
    name: Package ${{ matrix.artifact }}
    needs: flutter-verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: webos
            script: flutter/scripts/build-webos.sh
            args: "--release"
            pattern: "Prairie-webos.ipk"
          - artifact: tizen-6.0
            script: flutter/scripts/build-tizen.sh
            args: "6.0 --package-version ${{ needs.flutter-verify.outputs.version }}"
            pattern: "Prairie-tizen-api6.0.tpk"
          - artifact: tizen-6.5
            script: flutter/scripts/build-tizen.sh
            args: "6.5 --package-version ${{ needs.flutter-verify.outputs.version }}"
            pattern: "Prairie-tizen-api6.5.tpk"
          - artifact: tizen-10.0
            script: flutter/scripts/build-tizen.sh
            args: "10.0 --package-version ${{ needs.flutter-verify.outputs.version }}"
            pattern: "Prairie-tizen-api10.0.tpk"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Attempt native package build
        id: build
        env:
          ATTEMPT: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.attempt_native_builds }}
          FAIL_WITHOUT_SDK: ${{ inputs.fail_without_sdk || false }}
        run: |
          set -euo pipefail
          mkdir -p flutter/artifacts
          if [[ "${ATTEMPT}" != "true" ]]; then
            echo "Skipping native build (attempt_native_builds=false)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          # shellcheck disable=SC2086
          bash ${{ matrix.script }} ${{ matrix.args }} --out flutter/artifacts
          code=$?
          set -e

          if [[ $code -eq 0 ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $code -eq 127 ]]; then
            echo "::notice::SDK toolchain missing for ${{ matrix.artifact }} on this runner."
            echo "::notice::Install flutter-tizen / flutter-webos on a self-hosted runner, or build locally with flutter/scripts/."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            if [[ "${FAIL_WITHOUT_SDK}" == "true" ]]; then
              exit 127
            fi
            # Write a marker so the artifact job still has something to upload
            # documenting the skip (keeps Release structure ready).
            cat > "flutter/artifacts/${{ matrix.artifact }}.SKIPPED.txt" <<EOF
          Artifact: ${{ matrix.artifact }}
          Reason: flutter-tizen / flutter-webos toolchain not available on runner
          Version: ${{ needs.flutter-verify.outputs.version }}
          Build locally: bash ${{ matrix.script }} ${{ matrix.args }}
          EOF
            exit 0
          fi

          echo "Build failed with exit code $code" >&2
          exit "$code"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prairie-${{ matrix.artifact }}-${{ needs.flutter-verify.outputs.version }}
          path: |
            flutter/artifacts/${{ matrix.pattern }}
            flutter/artifacts/${{ matrix.artifact }}.SKIPPED.txt
          if-no-files-found: warn

  release-notes:
    name: Attach packages to GitHub Release
    needs: [flutter-verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: prairie-*
          merge-multiple: true

      - name: List artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find release-artifacts -type f -print || true
          # Prefer real packages; SKIPPED markers are acceptable on ubuntu-latest.
          if ! find release-artifacts -type f \( -name '*.tpk' -o -name '*.ipk' -o -name '*.SKIPPED.txt' \) | grep -q .; then
            echo "No package artifacts or skip markers found" >&2
            exit 1
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Prairie Smart TV ${{ needs.flutter-verify.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
