name: Release packages

# Builds the two Flutter Smart TV release artifacts:
#   1. webOS .ipk
#   2. Tizen .tpk — a single build covers the whole supported range
#      (tizen-manifest.xml's api-version="6.5" spans Tizen 6.5-9.0+). The
#      old 3-variant (6.0/6.5/10.0) split only ever existed because
#      video_player_avplay ships precompiled, api-version-specific native
#      libraries; this app uses video_player_videohole, which compiles from
#      source with no such split — see flutter/scripts/build-tizen.sh.
#
# Both packaging jobs install their SDK toolchain from scratch on a
# GitHub-hosted runner (no self-hosted runner, no persistent infra).
#
# Tizen (package-tizen):
#   - ubuntu-22.04 + deadsnakes python3.8 (Tizen package-manager still
#     pulls libpython3.8; ubuntu-24.04 does not ship it).
#   - Tizen SDK 10.0 CLI installer (same as flutter-tizen CI).
#   - NativeCLI + NativeToolchain-Gcc-9.2 + IOT-Headed-6.0 native CLI —
#     enough to build a .NET TPK. Samsung TV Extension images are web/
#     emulator tooling and are not required for flutter-tizen packaging.
#   - Signing uses a fresh author cert created in CI under gnome-keyring
#     (tizen security-profiles needs a keyring session on Linux). That
#     produces an installable-in-Developer-Mode .tpk, not a Store-signed
#     one — re-sign with your real distributor certificate at install
#     time (Apps2Samsung, or Tizen Studio's Certificate Manager).
#
# webOS (package-webos):
#   - ubuntu-22.04 x86_64. flutter-webos bundles its own Flutter SDK, so
#     we do not use subosito/flutter-action (which has no Linux arm64
#     stable builds anyway).
#   - Official LG NDK installer from lg-flutter-webos/ndk (not the
#     community webosbrew ARM64 toolchain).
#
# Local builds:
#   bash flutter/scripts/build-tizen.sh
#   bash flutter/scripts/build-tizen.sh --package-version 1.0.1 --security-profile Prairie_Server
#   bash flutter/scripts/build-webos.sh --obfuscate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver label for artifact names (e.g. 1.2.3). Empty = git describe / 0.0.0."
        required: false
        type: string
      attempt_native_builds:
        description: "If true, install SDKs and build real packages. If false, verify-only."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: smarttv-release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # flutter-tizen CI pins Tizen SDK 10.0; Studio 6.1 is EOL for new installs.
  TIZEN_SDK_VERSION: "10.0"
  WEBOS_NDK_INSTALLER_URL: "https://github.com/lg-flutter-webos/ndk/releases/download/11.2.0/webos-ndk-flutter-starfish-x86_64-ca9v1-11.2.0.sh"
  WEBOS_FLUTTER_NDK_ENV: "/usr/local/starfish-sdk-x86_64/environment-setup-ca9v1-webosmllib32-linux-gnueabi"
  WEBOS_ARES_NODE_VERSION: "16.20.2"

jobs:
  flutter-verify:
    name: Flutter analyze + test + layout
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      attempt: ${{ steps.attempt.outputs.attempt }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0)"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Resolve whether to attempt native builds
        id: attempt
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ATTEMPT: ${{ inputs.attempt_native_builds }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "attempt=${INPUT_ATTEMPT}" >> "$GITHUB_OUTPUT"
          else
            echo "attempt=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: prairie_core analyze + test
        working-directory: flutter/packages/prairie_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: prairie_webos workspace analyze
        working-directory: flutter/packages
        run: |
          flutter pub get
          flutter analyze --fatal-infos prairie_webos flutter_secure_storage_webos

      - name: Validate package layout
        run: bash flutter/scripts/validate-package-layout.sh

  package-tizen:
    name: Package Tizen (.tpk)
    needs: flutter-verify
    if: needs.flutter-verify.outputs.attempt == 'true'
    # Match flutter-tizen CI: Jammy has the python3.8 packages Tizen's
    # package-manager still requires; Noble does not.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Set up .NET (prairie_tizen is a C# runner)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "6.0.x"

      - name: Install Tizen host dependencies
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y \
            libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 \
            dbus-x11 gnome-keyring

      - name: Cache Tizen SDK
        id: cache-tizen-sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/tizen-studio
            ~/tizen-studio-data
          key: tizen-sdk-${{ env.TIZEN_SDK_VERSION }}-native-iotheaded65-v3

      - name: Install Tizen SDK CLI
        if: steps.cache-tizen-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o installer.bin \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_${TIZEN_SDK_VERSION}/web-cli_Tizen_SDK_${TIZEN_SDK_VERSION}_ubuntu-64.bin"
          chmod +x installer.bin
          ./installer.bin --accept-license "$HOME/tizen-studio"
          rm installer.bin

          PM="$HOME/tizen-studio/package-manager/package-manager-cli.bin"
          # api-version 6.5 needs the 6.5 rootstrap (flutter-tizen e2e uses 6.0
          # because its sample apps target 6.0). Install both toolchains plus
          # NativeCLI.
          "$PM" install --accept-license --no-java-check \
            NativeCLI NativeToolchain-Gcc-9.2 \
            IOT-Headed-6.5-NativeAppDevelopment-CLI || {
            echo "::warning::Tizen package install failed — listing available packages:"
            "$PM" show-pkgs --tree || true
            exit 1
          }

      - name: Add Tizen SDK to PATH
        run: echo "$HOME/tizen-studio/tools/ide/bin:$HOME/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Cache flutter-tizen
        id: cache-flutter-tizen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter-tizen
          key: flutter-tizen-checkout-v1

      - name: Install flutter-tizen
        if: steps.cache-flutter-tizen.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/flutter-tizen/flutter-tizen.git "$HOME/flutter-tizen"

      - name: Add flutter-tizen to PATH
        run: echo "$HOME/flutter-tizen/bin" >> "$GITHUB_PATH"

      - name: flutter-tizen doctor
        run: flutter-tizen doctor -v

      - name: Register signing profile
        # tizen security-profiles talks to the GNOME keyring on Linux; wrap
        # in dbus-run-session like flutter-tizen CI does.
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            set -euo pipefail
            echo tizen | gnome-keyring-daemon --unlock
            tizen certificate -a CI_Sideload -p tizen -f CI_Sideload
            tizen security-profiles add \
              -n CI_Sideload \
              -a "$HOME/tizen-studio-data/keystore/author/CI_Sideload.p12" \
              -p tizen \
              --active
          '

      - name: Build
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            set -euo pipefail
            echo tizen | gnome-keyring-daemon --unlock
            bash flutter/scripts/build-tizen.sh \
              --package-version "${{ needs.flutter-verify.outputs.version }}" \
              --security-profile CI_Sideload
          '

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prairie-tizen-${{ needs.flutter-verify.outputs.version }}
          path: flutter/artifacts/Prairie-tizen.tpk
          if-no-files-found: error

  package-webos:
    name: Package webOS (.ipk)
    needs: flutter-verify
    if: needs.flutter-verify.outputs.attempt == 'true'
    # Official LG flutter-webos NDK is Linux x86_64 only.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install webOS host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip cmake pkg-config file \
            libgtk-3-0 libgtk-3-dev git ninja-build clang git-lfs

      - name: Set up Node for ares-cli
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.WEBOS_ARES_NODE_VERSION }}

      - name: Install ares-cli
        run: npm install -g @webos-tools/cli

      - name: Install webOS NDK
        # Installs into /usr/local — not cacheable via actions/cache without
        # awkward sudo restore; the installer is ~fast enough to redo each run.
        run: |
          set -euo pipefail
          curl -fsSL -o ndk-installer.sh "$WEBOS_NDK_INSTALLER_URL"
          chmod +x ndk-installer.sh
          sudo ./ndk-installer.sh -y
          rm ndk-installer.sh
          test -f "$WEBOS_FLUTTER_NDK_ENV"

      - name: Point flutter-webos at the NDK
        run: echo "WEBOS_FLUTTER_NDK_ENV=$WEBOS_FLUTTER_NDK_ENV" >> "$GITHUB_ENV"

      - name: Cache flutter-webos
        id: cache-flutter-webos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter-webos
          key: flutter-webos-checkout-v1

      - name: Install flutter-webos
        if: steps.cache-flutter-webos.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/lg-flutter-webos/flutter-webos.git "$HOME/flutter-webos"

      - name: Add flutter-webos to PATH
        run: echo "$HOME/flutter-webos/bin" >> "$GITHUB_PATH"

      - name: flutter-webos doctor + precache
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$WEBOS_FLUTTER_NDK_ENV"
          flutter-webos doctor -v
          flutter-webos precache

      - name: Build
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$WEBOS_FLUTTER_NDK_ENV"
          bash flutter/scripts/build-webos.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prairie-webos-${{ needs.flutter-verify.outputs.version }}
          path: flutter/artifacts/Prairie-webos.ipk
          if-no-files-found: error

  release-notes:
    name: Attach packages to GitHub Release
    needs: [flutter-verify, package-tizen, package-webos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all package artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: release-artifacts
          pattern: prairie-*
          merge-multiple: true

      - name: Require real packages
        run: |
          set -euo pipefail
          find release-artifacts -type f -print || true
          if ! find release-artifacts -type f \( -name '*.tpk' -o -name '*.ipk' \) | grep -q .; then
            echo "::error::No .tpk/.ipk produced for this tag — refusing to publish an empty release." >&2
            exit 1
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Prairie Smart TV ${{ needs.flutter-verify.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
